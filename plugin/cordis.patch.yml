# dsh-memory bundle patch: mount the memory plugin into the host plugin graph.
#
# Applied over the dsh-base layer. Later layers (the profile's own
# cordis.patch.yml and --patch overlays) can still address this row by id,
# e.g. to override config:
#
#   - id: dsh-memory
#     name: 'dsh-memory'
#     config:
#       autoRecall: false
- insert:
    - id: dsh-memory
      name: 'dsh-memory'
